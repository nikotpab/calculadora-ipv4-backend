# /etc/nginx/conf.d/calculadora-ipv4.conf
#
# Puerto 80. /api/ va a gunicorn (127.0.0.1:8000); el resto son los
# archivos estáticos del frontend en /var/www/calculadora-ipv4.
# Frontend y API comparten origen, así que no hace falta CORS.

upstream calculadora_ipv4_api {
    server 127.0.0.1:8000;
}

server {
    # default_server: atiende las peticiones que llegan por IP. Si "nginx -t"
    # avisa de "duplicate default server", ver DESPLIEGUE.md, paso 3.
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/calculadora-ipv4;
    index index.html;

    server_tokens off;
    client_max_body_size 8k;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/calculadora-ipv4.access.log;
    error_log  /var/log/nginx/calculadora-ipv4.error.log;

    location /api/ {
        proxy_pass http://calculadora_ipv4_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # Raíz: sirve index.html si existe; si aún no se ha copiado el frontend,
    # responde un 404 limpio (en vez de un 403 por listar el directorio).
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
